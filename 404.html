<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Off the map — AJ Holidays</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0B0F19" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0B0F19; --fg:#E8EDF7; --fg-muted:#A8B6D1; --fg-dim:#93A2BF;
    --cyan:#00F2FE; --on-cyan:#04121A; --line:rgba(255,255,255,.10);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color-scheme:dark; }
  body{
    font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-weight:300; color:var(--fg); line-height:1.6;
    display:grid; place-items:center; padding:24px; text-align:center;
    background:
      radial-gradient(120% 85% at 50% 40%, rgba(0,242,254,.07), transparent 60%),
      var(--bg);
  }
  .mono{
    font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:400;
    font-size:.72rem; letter-spacing:.16em; text-transform:uppercase;
  }
  .code{ color:var(--cyan); margin:0 0 20px; }
  h1{
    font-size:clamp(2rem,6vw,3.4rem); font-weight:200; letter-spacing:-.03em;
    line-height:1.06; margin:0 0 16px;
  }
  p.lede{ color:var(--fg-muted); max-width:46ch; margin:0 auto 32px; }
  .actions{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  a.btn{
    display:inline-flex; align-items:center; justify-content:center;
    min-height:48px; padding:0 24px; border-radius:999px;
    text-decoration:none; font-size:.95rem; font-weight:500;
    border:1px solid transparent;
    transition:transform 220ms cubic-bezier(.22,.61,.36,1), background 220ms, border-color 220ms;
  }
  a.solid{ background:var(--cyan); color:var(--on-cyan); }
  a.ghost{ background:rgba(255,255,255,.05); color:var(--fg); border-color:rgba(255,255,255,.16); }
  a.btn:hover{ transform:translateY(-2px); }
  a.btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:3px; }
  .coords{ color:var(--fg-dim); margin-top:40px; }
  @media (prefers-reduced-motion:reduce){ a.btn{ transition:none; } a.btn:hover{ transform:none; } }
</style>
</head>
<body>
  <main>
    <p class="mono code">◦ ERROR 404 · NO ROUTE FOUND</p>
    <h1>This one's off<br />the map.</h1>
    <p class="lede">
      The page you're looking for doesn't exist. The destinations, though, very much do.
    </p>
    <div class="actions">
      <a class="btn solid" href="/">Back to the globe</a>
      <a class="btn ghost" href="/#packages">See packages</a>
    </div>
    <p class="mono coords">HSR LAYOUT · BENGALURU · 12.9°N 77.6°E</p>
  </main>
</body>
</html>
